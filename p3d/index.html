{const g=new THREE.Group();const sh=shapeFrom(geo.loco.pts,LW,LH);const eg=new THREE.ExtrudeGeometry(sh,{depth:D*1.05,bevelEnabled:false,curveSegments:4});eg.translate(0,0,-D*1.05/2);sideColors(eg,()=>false);

// 앞쪽 풀숲 (종이 오리기 실루엣) — 가까울수록 빨리 지나감

function bushTex(seed){const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');let r=seed;const R=()=>(r=(r*9301+49297)%233280)/233280;

  for(const p of props){p.position.x-=V*dt*(p.position.z>0?1:1);if(p.position.x<-SPAN/2)p.position.x+=SPAN}
  for(const p of fgs){p.position.x-=V*dt;if(p.position.x<-SPAN/2)p.position.x+=SPAN}
  for(const p of poles){p.position.x-=V*dt;if(p.position.x<-SPAN/2)p.position.x+=SPAN}
  // 열차 흔들림
  cars.forEach((g,i)=>{g.position.y=Math.max(0,Math.sin(t*5.2+i*1.3))*.012;g.rotation.z=Math.sin(t*2.1+i)*.0025});
  walkers.forEach(w=>{w.m.scale.y=1+Math.sin(t*2.2+w.ph)*.012;w.m.rotation.z=Math.sin(t*1.4+w.ph)*.012});
  // 밤
  const L=1-Math.pow(.04,dt);hemi.intensity+=((night?.16:1.6)-hemi.intensity)*L;sun.intensity+=((night?.08:2.2)-sun.intensity)*L;lights.forEach(l=>l.intensity+=((night?7:0)-l.intensity)*L);
  backMat.color.lerp(nightC[night?1:0],L);S.fog.color.lerp(fogC[night?1:0],L);pools.forEach(p=>p.material.opacity+=((night?.9:0)-p.material.opacity)*L);rooms.forEach(m=>m.material.color.lerp(roomC[night?1:0],L));fgMats.forEach(m=>m.color.lerp(fgC[night?1:0],L));
  // 카메라
  fx+=(tfx-fx)*.08;yaw+=(tyaw+hov[0]*-.08-yaw)*.06;pitch+=(tpitch+hov[1]*.05-pitch)*.06;dist+=(tdist-dist)*.07;
  const ty=zoomCar?CH*.55:1.25+Math.sin(t*.3)*.05;const tgt=new THREE.Vector3(fx,ty,0);
  cam.position.set(fx+Math.sin(yaw)*dist*Math.cos(pitch),ty+Math.sin(pitch)*dist,Math.cos(yaw)*dist*Math.cos(pitch));cam.lookAt(tgt);
  sun.position.set(fx-8,16,12);sun.target.position.set(fx,0,0);
  R.render(S,cam);
  // 이름표 위치
  cars.forEach((g,i)=>{tmp.set(g.userData.cx-TRL/2,(g.userData.k==='loco'?LH:CH)+.35,D/2);tmp.project(cam);const l=labels[i];if(tmp.z>1||Math.abs(tmp.x)>1.2){l.style.display='none';return}l.style.display='';l.style.left=((tmp.x+1)/2*innerWidth)+'px';l.style.top=((1-tmp.y)/2*innerHeight)+'px'})}
requestAnimationFrame(frame);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);cf=camFor();if(!zoomCar)tdist=cf.d});
window.__p3d={dbg:()=>({night,h:hemi.intensity,bc:backMat.color.getHexString()}),cars,enter,setNight:v=>{night=!v;$('bNight').click()}};
</script></body></html>
