let AC=null,MG=null,sndOn=false,nextClack=0;
function noiseBuf(ac,sec){const b=ac.createBuffer(1,ac.sampleRate*sec,ac.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5}return b}

  // 파도
  const n=AC.createBufferSource();n.buffer=noiseBuf(AC,6);n.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;
  const wg=AC.createGain();wg.gain.value=.22;const lfo=AC.createOscillator();lfo.frequency.value=.09;const lg=AC.createGain();lg.gain.value=.14;lfo.connect(lg);lg.connect(wg.gain);
  n.connect(lp);lp.connect(wg);wg.connect(MG);n.start();lfo.start();
  // 객실 웅웅
  const h=AC.createBufferSource();h.buffer=noiseBuf(AC,4);h.loop=true;const hp=AC.createBiquadFilter();hp.type='lowpass';hp.frequency.value=140;const hg=AC.createGain();hg.gain.value=.35;

  o.connect(og);og.connect(MG);o.start(at);o.stop(at+.16)}

const cmV=new THREE.Vector3();
function cmFrame(now){
  if(cmCur){const c=CM[cmCur.id],im=cmCur.im,t=now/1000;
    if(cmCur.mode!==MODE){cmEnd();requestAnimationFrame(cmFrame);return}
    let k=((cmCur.held||now)-cmCur.t0)/cmCur.dur;
    if(k>=1){cmEnd();requestAnimationFrame(cmFrame);return}
    // 걷다가 가운데서 잠깐 서서 창밖 보기(서 있는 손님)
    const kk=c.k==='walk'?k:(k<.4?k/.4*.5:k<.6?.5:.5+(k-.6)/.4*.5);const moving=c.k==='walk'||k<.4||k>.6;
    const bob=moving?Math.abs(Math.sin(t*5.5+cmCur.ph))*.25:0,rot=moving?Math.sin(t*5.5+cmCur.ph)*1.1:0;
    const op=Math.min(1,k/.06,(1-k)/.06);im.style.opacity=op;
    if(!cmCur.inside){ // 불새: 하늘
      cmo.style.zIndex='';let x,y,H;
      if(MODE==='seat'){const h=vwLayout.h||innerHeight*.5,y0=vwLayout.y||innerHeight*.15;H=h*.38;x=innerWidth+40-(innerWidth+H*cmCur.ar+80)*k;y=y0+h*.08+Math.sin(t*1.6+cmCur.ph)*H*.18}
      else{H=innerHeight*.16;x=innerWidth+40-(innerWidth+H*cmCur.ar+80)*k;y=innerHeight*.12+Math.sin(t*1.6+cmCur.ph)*H*.3}
      im.style.height=H+'px';im.style.width=H*cmCur.ar+'px';im.style.transform=`translate(${x}px,${y}px) rotate(${Math.sin(t*1.6)*6}deg)`}
    else if(MODE==='seat'){ // 칸 문 쪽에서 빼꼼: 화면 왼쪽 끝에서 들어와 잠깐 멈췄다가 나감 (발은 화면 아래로 잘림)
      cmo.style.zIndex='3';const mob=innerWidth<innerHeight,H=innerHeight*(mob?.62:.86)*c.s,W=H*cmCur.ar;
      const e=k<.18?k/.18:k>.82?(1-k)/.18:1,ee=e*e*(3-2*e);const x=-W+ee*W*(mob?.62:.7),y=innerHeight-H*.86;
      const br=1+Math.sin(t*1.8+cmCur.ph)*.006;im.style.opacity=1;
      im.style.height=H+'px';im.style.width=W+'px';im.style.transformOrigin='50% 100%';im.style.transform=`translate(${x}px,${y}px) scale(${br}) rotate(${(1-ee)*-3}deg)`;if(!cmCur.said&&k>.24){cmCur.said=1;cmSay(cmCur.id,im)}}
    else{ // 칸 안: 바닥(0.93)에 발, 칸 오른쪽 끝 → 왼쪽 끝
      cmo.style.zIndex='';const cc=cmCur.car,w=cc.userData.w,cx=train.position.x+cc.position.x;
      const lx=cx+w*.40-w*.80*kk,Hw=1.3*c.s;
      cmV.set(lx,0.93,0.06).project(cam);const fy=(-cmV.y*.5+.5)*innerHeight,sx=(cmV.x*.5+.5)*innerWidth;
      cmV.set(lx,0.93+Hw,0.06).project(cam);const ty=(-cmV.y*.5+.5)*innerHeight,H=fy-ty,W=H*cmCur.ar;
      im.style.height=H+'px';im.style.width=W+'px';im.style.transform=`translate(${sx-W/2}px,${ty-bob*H*.03}px) rotate(${rot}deg)`}}
  else if(now>cmNext&&!document.hidden&&!cmBusy()){const w=where(dep,vnow());if(w.mode==='run'){
      const ids=Object.keys(CM).filter(id=>CM[id].segs.includes(w.seg.id));

function vwShow(src){const im=new Image();im.onload=()=>{const nx=1-vwCur,e=vwEl[nx];e.style.backgroundImage='url('+src+')';
    vwSize={w:im.width,h:im.height};vwX=0;e.classList.add('on');vwEl[vwCur].classList.remove('on');vwCur=nx;vwLayout()};im.src=src}
function vwLayout(){const a=innerWidth/innerHeight,h=innerHeight*(a<1?.42:.66),cy=innerHeight*(a<1?.36:.42);
  const w=h*vwSize.w/vwSize.h;for(const e of vwEl)e.style.backgroundSize=w+'px '+h+'px';vwLayout.h=h;vwLayout.w=w;vwLayout.y=cy-h/2}

  if(id!==vwSeg){vwSeg=id;vwIdx=0}else vwIdx=(vwIdx+1)%L.length;vwShow(L[vwIdx])}
function vwTick(dt,t){if(MODE!=='seat')return;
  {const w=where(dep,vnow()),mk=w.mode==='run'?MIDS[w.seg.id]:null,sm=document.getElementById('sMid'),sp=document.getElementById('sPole');
   const H=vwLayout.h||innerHeight*.5,Y=vwLayout.y||innerHeight*.15;
   if(mk){const mh=H*.36;if(sm.dataset.k!==mk[0]){sm.dataset.k=mk[0];sm.style.backgroundImage='url(img/m/'+mk[0]+'.webp)'}sm.style.display='';sm.style.top=(Y+H*.98-mh)+'px';sm.style.height=mh+'px';sm.style.backgroundSize='auto '+mh+'px';
     vwTick.mx=(vwTick.mx||0)+dt*95;sm.style.backgroundPositionX=(-vwTick.mx)+'px';sm.style.filter='brightness('+(.8*mk[1])+') saturate(.85)'}else sm.style.display='none';
   sp.style.top=(Y-H*.05)+'px';sp.style.height=(H*1.1)+'px';sp.style.backgroundSize='auto '+(H*1.1)+'px';vwTick.px=(vwTick.px||0)+dt*1250;sp.style.backgroundPositionX=(-vwTick.px)+'px';
   sp.style.display=(w.mode==='run'&&(w.seg.id==='cloud'||w.seg.id==='dawn'||w.seg.id==='sea'))?'none':''}if(!vwSeg){vwNext();return}
  const winW=innerWidth*(innerWidth<innerHeight?.7:.62),span=Math.max(0,vwLayout.w-winW);
  vwX+=dt*18;                                              // 1초에 18px씩 흘러감
  const x0=(innerWidth-winW)/2,x=x0-Math.min(vwX,span),y=vwLayout.y+Math.sin(t*2.1)*1.5;
  vwEl[vwCur].style.backgroundPosition=x+'px '+y+'px';
  if(vwX>span+40)vwNext();
  const w=where(dep,vnow());if(w.mode==='run'&&w.seg.id!==vwSeg)vwNext()}

const MQ=LS.get('bl_mail',{});const mqSave=()=>LS.set('bl_mail',MQ);
function seatSpanEnd(id){const q=PQ.find(x=>x[0]===id);if(!q)return TRIP_H;let i=SEG.findIndex(s=>s.id===q[1]);while(SEG[i+1]&&SEAT[SEG[i+1].id]===id)i++;return SEG[i+1]?SEG[i+1].h:TRIP_H}
function mailList(){return Object.entries(MQ).filter(([k,v])=>v.got).sort((a,b)=>b[1].at-a[1].at)}
function mailUnread(){return mailList().filter(([k,v])=>!v.read).length}
let mailBoot=true;
function mailTick(){if(!TRIP)return;const met=LS.get('bl_met',{}),ev3=LS.get('bl_ev3',{}),now=vnow();let fresh=[];
  for(const id in MAIL){
    if(met[id]&&!MQ[id+':bye'])MQ[id+':bye']={at:Q.has('mail')?now:Math.max(now+12*6e4,dep+seatSpanEnd(id)*HR)};
    if(ev3[id]&&MAIL[id].l3&&!MQ[id+':l3'])MQ[id+':l3']={at:Q.has('mail')?now:now+8*6e4}}
  for(const k in MQ){const v=MQ[k];if(!v.got&&v.at<=now){v.got=1;fresh.push(k)}}
  if(fresh.length){mqSave();const id=fresh[0].split(':')[0];
    mailToast(mailBoot&&fresh.length>1?'자리를 비운 사이 편지 '+fresh.length+'통이 도착했어요':(CAST[id]?CAST[id].n:'누군가')+'에게서 편지가 왔어요')}
  else mqSave();
  mailBoot=false;postBadge()}
setInterval(mailTick,5000);setTimeout(mailTick,2500);
