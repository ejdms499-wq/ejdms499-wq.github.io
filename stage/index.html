<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>부산발 런던행</title>
<style>
html,body{margin:0;height:100%;background:#0d2230;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#tag{position:fixed;z-index:4;left:14px;top:calc(12px + env(safe-area-inset-top));padding:7px 12px 7px 14px;background:#f3e6c4;color:#3a2a1c;
 font:600 12px/1.35 "Apple SD Gothic Neo","Noto Sans KR",sans-serif;border:2px solid #3a2a1c;border-radius:3px;box-shadow:3px 3px 0 #3a2a1c;transform:rotate(-1.5deg)}
#tag b{display:block;font-size:15px;letter-spacing:-.02em}
#tag::before{content:"";position:absolute;left:-7px;top:50%;width:8px;height:8px;margin-top:-4px;border:2px solid #3a2a1c;border-radius:50%;background:#0d2230}
#hint{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#f6e9c8;
 font:500 12px "Apple SD Gothic Neo","Noto Sans KR",sans-serif;opacity:.85;text-shadow:0 1px 2px #000a;white-space:nowrap;transition:opacity 1s}
#tag i{display:block;font-style:normal;font-weight:500;font-size:11px;opacity:.8;margin-top:1px}
#dev{position:fixed;z-index:4;left:12px;right:12px;bottom:calc(40px + env(safe-area-inset-bottom));display:none;gap:8px;align-items:center;background:#f3e6c4;border:2px solid #3a2a1c;border-radius:4px;padding:6px 10px;font:600 12px 'Apple SD Gothic Neo',sans-serif;color:#3a2a1c}
#dev input{flex:1}
#back{position:fixed;left:14px;z-index:4;bottom:calc(14px + env(safe-area-inset-bottom));display:none;background:#f3e6c4;color:#3a2a1c;border:2px solid #3a2a1c;box-shadow:2px 2px 0 #3a2a1c;border-radius:3px;padding:6px 11px;font:700 13px "Apple SD Gothic Neo",sans-serif}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 55%,transparent 55%,rgba(4,14,20,.42) 100%)}
#snd{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:#f3e6c4;color:#3a2a1c;border:2px solid #3a2a1c;box-shadow:2px 2px 0 #3a2a1c;border-radius:3px;padding:6px 11px;font:700 13px 'Apple SD Gothic Neo',sans-serif;z-index:3}
#snd.on{background:#3a2a1c;color:#f3e6c4}
#cab{position:fixed;inset:0;pointer-events:none;background:url(img/zcab_w_n.webp) center/cover no-repeat;display:none}
@media (max-aspect-ratio:3/4){#cab{background-image:url(img/zcab_m_n.webp)}}
body.day #cab{background-image:url(img/zcab_w_d.webp)}
@media (max-aspect-ratio:3/4){body.day #cab{background-image:url(img/zcab_m_d.webp)}}
#glass{position:fixed;inset:0;pointer-events:none;display:none;background:linear-gradient(115deg,transparent 30%,rgba(255,220,170,.06) 45%,transparent 55%)}
body.seat #cab,body.seat #glass{display:block}
.vw{position:fixed;inset:0;pointer-events:none;display:none;background-repeat:no-repeat;opacity:0;transition:opacity 2.4s;filter:saturate(.9) brightness(.92)}
body.seat .vw{display:block}
.vw.on{opacity:1}
#fade{position:fixed;inset:0;pointer-events:none;background:#08151c;opacity:0;transition:opacity .35s;z-index:5}
#fade.on{opacity:1}
.pbtn{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top));background:#f3e6c4;color:#3a2a1c;border:2px solid #3a2a1c;box-shadow:2px 2px 0 #3a2a1c;border-radius:3px;padding:6px 11px;font:700 13px 'Apple SD Gothic Neo',sans-serif;z-index:4}
</style></head><body>
<div id="tag"><b>부산</b><span id="tagS">그림 겹 무대 · 시험판</span><i id="tagI"></i></div>
<div id="dev"><span>출발 후</span><input id="devR" type="range" min="0" max="91.9" step="0.1"><span id="devV"></span></div>
<div class="vw" id="vwA"></div><div class="vw" id="vwB"></div><div id="glass"></div><div id="cab"></div><div id="vig"></div><div id="fade"></div>
<button id="snd">♪ 소리 켜기</button>
<button id="back">← 열차 전체</button>
<button id="seat" class="pbtn">내 창가 자리 →</button>
<div id="hint">옆으로 끌어서 둘러보기 · 칸을 누르면 가까이</div>
<script type="module">
import * as THREE from './three.module.js';
import {SEG,TRIP_H,lastDeparture,where} from './timetable.js';
/* ================= 구간 설정 (구간마다 이것만 바꾸면 됨) ================= */
const SCENE={
  name:'부산',
  far:{img:'far.webp',w:1904,h:640,hz:414,moonU:.805,moonAt:.74,fold:110},
  mid:{img:'mid.webp',w:1904,h:438,z:-70,hgt:26,topBelowHz:.0,tint:[.9,.9,.96],fx:{haze:.3,sat:.75,bri:.84}},
  emb:{img:'emb.webp',w:2176,h:310,rail:57,sea:288,scale:.0095,fx:{haze:.12,sat:.6,bri:.62}},
  ppl:[['pf_p02.webp','dine',.62,1.32]]
};
/* ======================================================================= */
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(R.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,1,0.5,6000);
const TAN=Math.tan(THREE.MathUtils.degToRad(15));let HZ=0.64; // 수평선 높이(아래에서)
const TL=new THREE.TextureLoader();
function tex(u,rep){const t=TL.load('img/'+u);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(rep)t.wrapS=THREE.RepeatWrapping;return t}
const VS=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
function mat(t,tint,fx){fx=Object.assign({haze:0,sat:1,bri:1,blur:0,hc:[.06,.17,.21]},fx||{});
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:false,
  uniforms:{map:{value:t},tint:{value:new THREE.Color(...(tint||[1,1,1]))},off:{value:0},rep:{value:1},
    haze:{value:fx.haze},sat:{value:fx.sat},bri:{value:fx.bri},blur:{value:fx.blur},hc:{value:new THREE.Vector3(...fx.hc)}},vertexShader:VS,
  fragmentShader:`uniform sampler2D map;uniform vec3 tint,hc;uniform float off,rep,haze,sat,bri,blur;varying vec2 vUv;
  void main(){vec2 uv=vec2(vUv.x*rep+off,vUv.y);vec4 c=texture2D(map,uv);
    if(blur>0.){vec2 d=vec2(blur/rep,blur)*.0012;c=c*.36+(texture2D(map,uv+vec2(d.x,0.))+texture2D(map,uv-vec2(d.x,0.))+texture2D(map,uv+vec2(0.,d.y*3.))+texture2D(map,uv-vec2(0.,d.y*3.)))*.16;}
    vec3 col=c.rgb*tint;float l=dot(col,vec3(.299,.587,.114));col=mix(vec3(l),col,sat)*bri;col=mix(col,hc,haze);
    gl_FragColor=vec4(col,c.a);
  #include <colorspace_fragment>
  }`})}
function carMat(t,r){return new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:false,
  uniforms:{map:{value:t},r:{value:new THREE.Vector4(...r)},glow:{value:1}},vertexShader:VS,
  fragmentShader:`uniform sampler2D map;uniform vec4 r;uniform float glow;varying vec2 vUv;
  void main(){vec4 c=texture2D(map,vUv);vec3 col=c.rgb;float l=dot(col,vec3(.299,.587,.114));
    float inR=step(r.x,vUv.x)*step(vUv.x,r.z)*step(r.y,vUv.y)*step(vUv.y,r.w);
    vec3 night=mix(vec3(l),col,.62)*vec3(.52,.6,.78);            // 달빛 받은 바깥 몸체
    vec3 warm=mix(vec3(l),col,.9)*vec3(1.08,.96,.8)*glow;       // 불 켜진 실내
    col=mix(night,warm,inR);
    gl_FragColor=vec4(col,c.a);
  #include <colorspace_fragment>
  }`})}
function plane(t,w,h,tint,fx){return new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat(t,tint,fx))}

/* ---------- 맨 뒤 그림: 화면에 고정된 무한히 먼 풍경 (하늘·달·먼 불빛·바다) ---------- */
const F=SCENE.far;
function backdrop(cutBelow){
  const m=new THREE.ShaderMaterial({depthWrite:false,depthTest:false,transparent:true,
    uniforms:{map:{value:farT},asp:{value:1},t:{value:0},cut:{value:-1},only:{value:cutBelow?1:0},Him:{value:.6},mAt:{value:.74},hz:{value:.64}},
    vertexShader:`varying vec2 s;void main(){s=position.xy*.5+.5;gl_Position=vec4(position.xy,0.,1.);}`,
    fragmentShader:`uniform sampler2D map;uniform float asp,t,cut,only,Him,mAt,hz;varying vec2 s;
    const float IW=${F.w}.,IH=${F.h}.,HZR=${F.hz}.;
    void main(){
      if(only>.5&&s.y>cut)discard;
      float yb=hz-(IH-HZR)/IH*Him;                                      // 그림 아래 끝
      float v=(s.y-yb)/Him;
      float Wx=Him*(IW/IH)/asp;
      float u=${F.moonU}+(s.x-mAt)/Wx;
      float water=step(v,(IH-HZR)/IH);
      if(v<0.){float k=${F.fold}./IH;float tt=-v;v=k-abs(mod(tt,2.*k)-k);}
      v=min(v,.999);
      float w=water*(1.-smoothstep(0.,.4,v));
      u+=sin(t*1.1+v*260.)*.0009*water+sin(t*.7+s.y*120.)*.0006*water;
      vec4 c=texture2D(map,vec2(clamp(u,.001,.999),v));
      vec3 col=c.rgb;float l=dot(col,vec3(.299,.587,.114));
      vec2 cell=floor(vec2(u*900.,v*300.));float hsh=fract(sin(dot(cell,vec2(12.9898,78.233)))*43758.5453);
      vec2 md=vec2((u-${F.moonU})*IW,(v-${(1-171/640).toFixed(3)})*IH)/IH;float dm=length(md);
      if(water<.5&&l>.62&&dm>.16){col*=.78+.22*sin(t*(1.2+hsh*2.5)+hsh*40.);}
      col+=vec3(1.,.82,.6)*(.16*exp(-dm*9.)+.05*exp(-dm*3.))*(1.-water)*(.92+.08*sin(t*.6));
      l=dot(col,vec3(.299,.587,.114));col=mix(vec3(l),col,.82);col=mix(col,vec3(.07,.18,.22),only>.5?.22:.14);
      gl_FragColor=vec4(col,1.);
      #include <colorspace_fragment>
    }`});
  const q=new THREE.Mesh(new THREE.PlaneGeometry(2,2),m);q.frustumCulled=false;return q;
}
const farT=tex(F.img);farT.wrapS=farT.wrapT=THREE.ClampToEdgeWrapping;
const far=backdrop(false);far.renderOrder=0;scene.add(far);
const nearWater=backdrop(true);nearWater.renderOrder=4;scene.add(nearWater);

/* ---------- 가운데 겹 (이음새 없는 반복 그림) ---------- */
const M=SCENE.mid, midT=tex(M.img,true);
const mid=plane(midT,1,1,M.tint,M.fx);mid.renderOrder=3;scene.add(mid);
/* ---------- 선로 둑 ---------- */
const E=SCENE.emb, embT=tex(E.img,true), embH=E.h*E.scale, embTile=E.w*E.scale, EMBW=embTile*12;
const emb=plane(embT,EMBW,embH,null,E.fx);emb.renderOrder=5;scene.add(emb);
const embTop=(E.rail)*E.scale, SEA=-(E.sea-E.rail)*E.scale;
emb.position.set(0,embTop-embH/2,0.4);

/* ---------- 열차 (손그림 단면) ---------- */
const PX=3.4/550;
const ORDER=[['tail','꿈 보관소'],['case','탐정 사무소'],['post','우체국칸'],['dome','별 전망칸'],['dine','식당칸'],['sleep','침대칸'],['loco','기관실']];
const train=new THREE.Group();scene.add(train);
const cars=[];let x=0;
for(const [k,name] of ORDER){
  const w=(k==='loco'?2856:1640)*PX,h=(k==='loco'?680:550)*PX;
  const p=plane(tex('car_'+k+'.webp'),w,h);p.renderOrder=6;
  p.position.set(x+w/2,h/2-0.03,0);p.userData={k,name,w,h,ph:Math.random()*6};train.add(p);cars.push(p);x+=w-0.22;
}
const TRAINW=x;train.position.x=-TRAINW/2;
/* ---------- 칸 사이 연결 주름막 ---------- */
function bellowsTex(){const c=document.createElement('canvas');c.width=64;c.height=256;const g=c.getContext('2d');
  g.fillStyle='#2a2d36';g.fillRect(0,0,64,256);
  for(let i=4;i<64;i+=10){g.fillStyle='#3f4552';g.fillRect(i,6,4,244);g.fillStyle='#1b1d24';g.fillRect(i+4,6,2,244)}
  g.fillStyle='#16171c';g.fillRect(0,0,64,8);g.fillRect(0,248,64,8);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const BT=bellowsTex();
for(let i=0;i<cars.length-1;i++){const a=cars[i],b=cars[i+1];const xm=(a.position.x+a.userData.w/2+b.position.x-b.userData.w/2)/2;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1.4,2.62),new THREE.MeshBasicMaterial({map:BT,depthTest:false,depthWrite:false,transparent:true}));
  m.position.set(xm,0.62+2.62/2,-0.01);m.renderOrder=5.9;train.add(m)}

/* ---------- 불빛: 칸 안에서 새어 나오는 빛 ---------- */
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,214,150,1)');r.addColorStop(.45,'rgba(255,190,120,.35)');r.addColorStop(1,'rgba(255,170,100,0)');
  g.fillStyle=r;g.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const GT=glowTex();
function glowSpr(w,h,a){const m=new THREE.MeshBasicMaterial({map:GT,transparent:true,opacity:a,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false});
  const q=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);return q}
const glows=[];
for(const c of cars){if(c.userData.k==='loco')continue;const W=c.userData.w;
  const b=glowSpr(W*0.95,c.userData.h*1.1,.22);b.position.set(c.position.x,c.userData.h*.47,0.02);b.renderOrder=6.5;train.add(b);
  const sp=glowSpr(W*1.15,1.6,.4);sp.position.set(c.position.x,0.05,0.5);sp.renderOrder=5.5;train.add(sp);
  glows.push([b,sp,Math.random()*9]);}

function person([file,car,fx,hgt]){
  const c=cars.find(c=>c.userData.k===car);const p=plane(tex(file),1,1);p.renderOrder=7;p.visible=false;
  const im=new Image();im.onload=()=>{p.scale.set(hgt*im.width/im.height,hgt,1);p.visible=true};im.src='img/'+file;
  p.position.set(c.position.x-c.userData.w/2+c.userData.w*fx,0.93+hgt/2,0.05);p.userData.base=p.position.y;p.userData.ph=Math.random()*6;
  train.add(p);return p;
}
const ppl=SCENE.ppl.map(person);

/* ---------- 두 가지 보기: 열차 바깥(out) / 내 창가 자리(seat) ---------- */
const MODES={
  out:{HZ:.64,eye:d=>1.7+.145*d,fit:()=>{const a=innerWidth/innerHeight;return Math.max(26,12.5/(2*TAN*a))},
       mid:{z:-70,hgt:26,top:0},embY:0,embZ:.4,skyK:1.15,moonAt:()=>F.moonAt,VL:0,VR:1,train:true,drag:1},
  seat:{HZ:.6,eye:()=>3.6,fit:()=>14,mid:{z:-45,hgt:14,top:.06},embY:1.55,embZ:4,skyK:.75,
       moonAt:()=>innerWidth<innerHeight?.56:.68,VL:0,VR:1,train:false,drag:.15}
};
let MODE='out',MD=MODES.out;
/* ---------- 카메라 ---------- */
const vh=k=>2*k*TAN;
let dist=26,camX=(()=>{const d=cars.find(c=>c.userData.k==='dine');return train.position.x+d.position.x+2})(),tgtX=camX,tgtD=dist,minD=9,maxD=80,focus=null;
const eyeAt=d=>MD.eye(d);
const clampX=()=>{tgtX=Math.max(-TRAINW/2+3,Math.min(TRAINW/2-3,tgtX))};
const ptrs=new Map();let lastPinch=0,moved=0,downX=0,downY=0;const el=R.domElement;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;downX=e.clientX;downY=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];lastPinch=Math.hypot(a.x-b.x,a.y-b.y)}});
el.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===2){p.x=e.clientX;p.y=e.clientY;const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastPinch&&MODE==='out'){tgtD=Math.max(minD,Math.min(maxD,tgtD*lastPinch/d));focus=null}lastPinch=d;moved=99;return}
  const dx=e.clientX-p.x;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx);
  tgtX-=dx*vh(dist)/innerHeight*MD.drag;clampX();if(moved>6)focus=null;hint()});
el.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)lastPinch=0;if(moved<6&&Math.hypot(e.clientX-downX,e.clientY-downY)<8)tap(e)});
el.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
el.addEventListener('wheel',e=>{e.preventDefault();if(MODE!=='out')return;tgtD=Math.max(minD,Math.min(maxD,tgtD*(1+e.deltaY*0.001)));focus=null},{passive:false});
const ray=new THREE.Raycaster(),v2=new THREE.Vector2(),tagB=document.querySelector('#tag b'),back=document.getElementById('back');
function tap(e){if(MODE!=='out')return;v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v2,cam);
  const h=ray.intersectObjects(cars)[0];if(!h)return;const c=h.object;focus=c;tgtX=train.position.x+c.position.x;clampX();
  const a=innerWidth/innerHeight;tgtD=Math.max(minD,Math.min(maxD,Math.max(c.userData.h*2.2/(2*TAN),c.userData.w*1.08/(2*TAN*a))));
  tagB.textContent=c.userData.name;tagS.textContent='';tagI.textContent='';back.style.display='block';seatB.textContent='이 칸 창가에 앉기 →';hint()}
back.onclick=()=>{focus=null;tgtD=fitD();back.style.display='none';seatB.textContent='내 창가 자리 →';clock()};
const seatB=document.getElementById('seat'),fadeEl=document.getElementById('fade');
let busy=false;
function setMode(m){MODE=m;MD=MODES[m];if(m==='seat'){vwSeg=null;document.getElementById('hint').style.display='none'}HZ=MD.HZ;document.body.classList.toggle('seat',m==='seat');train.visible=MD.train;resize()}
function goSeat(){if(busy)return;busy=true;
  const c=focus||cars.find(c=>c.userData.k==='sleep');focus=c;tgtX=train.position.x+c.position.x;tgtD=minD;
  setTimeout(()=>{fadeEl.classList.add('on');setTimeout(()=>{setMode('seat');back.style.display='none';focus=null;document.getElementById('hint').style.opacity=0;
    camX=tgtX;dist=tgtD=fitD();seatB.textContent='← 열차 전체 보기';clock();fadeEl.classList.remove('on');busy=false},380)},700)}
function goOut(){if(busy)return;busy=true;fadeEl.classList.add('on');
  setTimeout(()=>{setMode('out');dist=minD;focus=null;tgtD=fitD();seatB.textContent='내 창가 자리 →';clock();fadeEl.classList.remove('on');busy=false},380)}
seatB.onclick=e=>{e.stopPropagation();MODE==='out'?goSeat():goOut()};
if(new URLSearchParams(location.search).has('seat'))setTimeout(()=>{setMode('seat');camX=tgtX=train.position.x+cars.find(c=>c.userData.k==='sleep').position.x;dist=tgtD=fitD();seatB.textContent='← 열차 전체 보기'},0);
let hinted=0;function hint(){if(hinted)return;hinted=1;setTimeout(()=>document.getElementById('hint').style.opacity=0,1500)}
function fitD(){return MD.fit()}
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;
  cam.setViewOffset(innerWidth,innerHeight,0,innerHeight*(HZ-.5),innerWidth,innerHeight);cam.updateProjectionMatrix();
  {const a=cam.aspect,IW=F.w,IH=F.h;let Him=(1-HZ)*MD.skyK*IH/F.hz;let Wx=Him*(IW/IH)/a;
   const VL=MODE==='seat'?(a<1?.15:.19):0,VR=MODE==='seat'?(a<1?.85:.82):1,need=(VR-VL)*1.04;if(Wx<need){Him*=need/Wx;Wx=need}
   let mAt=Math.max(MD.moonAt(),VR-(0.995-F.moonU)*Wx);mAt=Math.min(mAt,VL+(F.moonU-0.005)*Wx);
   for(const q of [far,nearWater]){const U=q.material.uniforms;U.asp.value=a;U.Him.value=Him;U.mAt.value=mAt;U.hz.value=HZ}}if(!focus)tgtD=fitD()}
addEventListener('resize',resize);resize();dist=tgtD;

/* ---------- 시간표 ---------- */
const HR=36e5,Q=new URLSearchParams(location.search);
let OFF=0;const vnow=()=>Date.now()+OFF;let dep=lastDeparture();
if(Q.has('h'))OFF=dep+parseFloat(Q.get('h'))*HR-Date.now();
const pd=n=>String(n).padStart(2,'0');
const tagS=document.getElementById('tagS'),tagI=document.getElementById('tagI');
function dur(h){const m=Math.round(h*60);return m>=60?Math.floor(m/60)+'시간 '+(m%60?m%60+'분':''):m+'분'}
let curSeg=null;
function clock(){const w=where(dep,vnow());if(w.mode!=='run')return;
  if(focus)return;
  tagB.textContent=w.seg.name+(w.seg.art||MODE==='seat'?'':' · 그림 준비 중');
  document.body.classList.toggle('day',!/밤|자정|새벽/.test(w.seg.sky));
  tagS.textContent=w.day+'일째 · 현지 '+pd(w.localH)+':'+pd(w.localM)+' · '+w.seg.sky;
  tagI.textContent=w.next?'다음 '+w.next.name+' · '+dur(w.next.h-w.h)+' 뒤':'곧 런던';
  if(curSeg!==w.seg.id){curSeg=w.seg.id}
}
setInterval(clock,1000);setTimeout(clock,50);
if(Q.has('dev')){const d=document.getElementById('dev'),r=document.getElementById('devR'),v=document.getElementById('devV');d.style.display='flex';
  const sync=()=>{const h=(vnow()-dep)/HR;r.value=h;v.textContent=h.toFixed(1)+'시간'};sync();
  r.oninput=()=>{OFF=dep+parseFloat(r.value)*HR-Date.now();v.textContent=(+r.value).toFixed(1)+'시간';clock()}}


/* ---------- 소리: 덜컹덜컹 + 파도 (직접 합성) ---------- */
let AC=null,MG=null,sndOn=false,nextClack=0;
function noiseBuf(ac,sec){const b=ac.createBuffer(1,ac.sampleRate*sec,ac.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5}return b}
function initSound(){AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=0;MG.connect(AC.destination);
  // 파도
  const n=AC.createBufferSource();n.buffer=noiseBuf(AC,6);n.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;
  const wg=AC.createGain();wg.gain.value=.22;const lfo=AC.createOscillator();lfo.frequency.value=.09;const lg=AC.createGain();lg.gain.value=.14;lfo.connect(lg);lg.connect(wg.gain);
  n.connect(lp);lp.connect(wg);wg.connect(MG);n.start();lfo.start();
  // 객실 웅웅
  const h=AC.createBufferSource();h.buffer=noiseBuf(AC,4);h.loop=true;const hp=AC.createBiquadFilter();hp.type='lowpass';hp.frequency.value=140;const hg=AC.createGain();hg.gain.value=.35;
  h.connect(hp);hp.connect(hg);hg.connect(MG);h.start();
  nextClack=AC.currentTime+.2}
function clack(at,v){const b=AC.createBufferSource();b.buffer=noiseBuf(AC,.08);const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=1.4;
  const g=AC.createGain();g.gain.setValueAtTime(v*.5,at);g.gain.exponentialRampToValueAtTime(.001,at+.07);b.connect(bp);bp.connect(g);g.connect(MG);b.start(at);
  const o=AC.createOscillator();o.frequency.setValueAtTime(90,at);o.frequency.exponentialRampToValueAtTime(45,at+.12);const og=AC.createGain();og.gain.setValueAtTime(v*.55,at);og.gain.exponentialRampToValueAtTime(.001,at+.14);
  o.connect(og);og.connect(MG);o.start(at);o.stop(at+.16)}
function soundTick(){if(!AC||!sndOn)return;while(nextClack<AC.currentTime+.5){const c=nextClack;clack(c,.9);clack(c+.13,.7);clack(c+1.05,.85);clack(c+1.18,.65);nextClack+=2.1}}
setInterval(soundTick,200);
const sb=document.getElementById('snd');sb.onclick=e=>{e.stopPropagation();if(!AC)initSound();sndOn=!sndOn;AC.resume();
  MG.gain.cancelScheduledValues(AC.currentTime);MG.gain.linearRampToValueAtTime(sndOn?.55:0,AC.currentTime+.8);if(sndOn)nextClack=Math.max(nextClack,AC.currentTime+.1);
  sb.textContent=sndOn?'♪ 소리 끄기':'♪ 소리 켜기';sb.classList.toggle('on',sndOn)};

/* ---------- 창가 자리: 창밖 풍경 그림이 계속 지나감 ---------- */
const V=n=>'img/v/'+n+'.webp';
const VIEWS={busan:[V('busan_1'),V('busan_2')],seoul:[V('seoul_1'),V('seoul_2')],cloud:[V('cloud_1'),V('cloud_2')],
  snow:[V('snow_1'),V('snow_2')],baikal:[V('baikal_1'),V('baikal_2')],aurora:[V('aurora_1'),V('aurora_2')],
  taiga:[V('taiga_1'),V('taiga_2')],moscow:[V('moscow_1'),V('moscow_2')],plain:[V('plain_1'),V('plain_2')],
  forest:[V('forest_1'),V('forest_2')],castle:[V('castle_1'),'../img/zh_castle.webp'],alps:[V('alps_1'),V('alps_2'),'../img/zh_alps.webp'],
  paris:[V('paris_1'),V('paris_2')],sea:[V('sea_1'),'../img/zt_sea.webp'],england:[V('england_1'),V('england_2')],london:[V('london_1')]};
const vwEl=[document.getElementById('vwA'),document.getElementById('vwB')];
let vwCur=0,vwImg=null,vwX=0,vwIdx=0,vwSeg=null,vwSize={w:1,h:1};
function vwShow(src){const im=new Image();im.onload=()=>{const nx=1-vwCur,e=vwEl[nx];e.style.backgroundImage='url('+src+')';
    vwSize={w:im.width,h:im.height};vwX=0;e.classList.add('on');vwEl[vwCur].classList.remove('on');vwCur=nx;vwLayout()};im.src=src}
function vwLayout(){const a=innerWidth/innerHeight,h=innerHeight*(a<1?.42:.66),cy=innerHeight*(a<1?.36:.42);
  const w=h*vwSize.w/vwSize.h;for(const e of vwEl)e.style.backgroundSize=w+'px '+h+'px';vwLayout.h=h;vwLayout.w=w;vwLayout.y=cy-h/2}
addEventListener('resize',vwLayout);
function vwNext(){const w=where(dep,vnow());const id=w.mode==='run'?w.seg.id:'busan';const L=VIEWS[id]||VIEWS.busan;
  if(id!==vwSeg){vwSeg=id;vwIdx=0}else vwIdx=(vwIdx+1)%L.length;vwShow(L[vwIdx])}
function vwTick(dt,t){if(MODE!=='seat')return;if(!vwSeg){vwNext();return}
  const winW=innerWidth*(innerWidth<innerHeight?.7:.62),span=Math.max(0,vwLayout.w-winW);
  vwX+=dt*18;                                              // 1초에 18px씩 흘러감
  const x0=(innerWidth-winW)/2,x=x0-Math.min(vwX,span),y=vwLayout.y+Math.sin(t*2.1)*1.5;
  vwEl[vwCur].style.backgroundPosition=x+'px '+y+'px';
  if(vwX>span+40)vwNext();
  const w=where(dep,vnow());if(w.mode==='run'&&w.seg.id!==vwSeg)vwNext()}

/* ---------- 매 프레임 ---------- */
const SPEED=7;let travel=0,last=performance.now();const T0=last;const pv=new THREE.Vector3();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-T0)/1000;travel+=SPEED*dt;
  const L=1-Math.pow(.02,dt);camX+=(tgtX-camX)*L;dist+=(tgtD-dist)*L;
  const eye=eyeAt(dist)+Math.sin(t*.21)*.06;const cx=camX+Math.sin(t*.13)*.25;cam.position.set(cx,eye,dist);cam.lookAt(cx,eye,0);cam.updateMatrixWorld();
  far.material.uniforms.t.value=nearWater.material.uniforms.t.value=t;
  // 가운데 겹: 위쪽 끝을 기본 화면의 수평선 바로 아래에
  const MM=MD.mid,dm=fitD()-MM.z,top=eyeAt(fitD())-MM.top*vh(dm),midTile=MM.hgt*M.w/M.h,MIDW=midTile*3;
  mid.scale.set(MIDW,MM.hgt,1);mid.position.set(camX,top-MM.hgt/2,MM.z);
  mid.material.uniforms.rep.value=3;mid.material.uniforms.off.value=(((camX-MIDW/2+travel)/midTile)%1+1)%1;
  emb.position.set(camX,embTop-embH/2+MD.embY,MD.embZ);emb.material.uniforms.rep.value=EMBW/embTile;emb.material.uniforms.off.value=(((camX-EMBW/2+travel)/embTile)%1+1)%1;
  // 가까운 바다: 둑 아래만
  pv.set(camX,SEA+0.25+MD.embY,MD.embZ).project(cam);nearWater.material.uniforms.cut.value=pv.y*.5+.5;
  for(const c of cars)c.position.y=c.userData.h/2-0.03+Math.sin(t*9+c.userData.ph)*0.012;
  for(const [b,sp,ph] of glows){const f=1+Math.sin(t*1.7+ph)*.05+Math.sin(t*7.3+ph*2)*.025;b.material.opacity=.22*f;sp.material.opacity=.4*f}
  for(const p of ppl)p.position.y=p.userData.base+Math.abs(Math.sin(t*2.2+p.userData.ph))*0.03;
  vwTick(dt,t);if(MODE!=='seat')R.render(scene,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
