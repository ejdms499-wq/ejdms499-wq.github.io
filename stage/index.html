<script type="module">
import * as THREE from './three.min.js';

/* ================= 구간 설정 (구간마다 이것만 바꾸면 됨) ================= */
const SCENE={
  name:'부산',
  far:{img:'far.webp',w:1904,h:640,hz:414,moonU:.805,moonAt:.74,fold:110},
  mid:{img:'mid.webp',w:1904,h:438,z:-70,hgt:26,topBelowHz:.0,tint:[.9,.9,.96],fx:{haze:.3,sat:.75,bri:.84}},
  emb:{img:'emb.webp',w:2176,h:310,rail:57,sea:288,scale:.0095,fx:{haze:.12,sat:.6,bri:.62}},

const LOWP=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)||innerWidth<700;

R.setPixelRatio(Math.min(devicePixelRatio,LOWP?1.5:2));R.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(R.domElement);

const cam=new THREE.PerspectiveCamera(30,1,0.5,6000);
const TAN=Math.tan(THREE.MathUtils.degToRad(15));let HZ=0.64; // 수평선 높이(아래에서)
const TL=new THREE.TextureLoader();
function tex(u,rep){const t=TL.load('img/'+u);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(rep)t.wrapS=THREE.RepeatWrapping;return t}
const VS=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
function mat(t,tint,fx){fx=Object.assign({haze:0,sat:1,bri:1,blur:0,hc:[.06,.17,.21]},fx||{});
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:false,
  uniforms:{map:{value:t},tint:{value:new THREE.Color(...(tint||[1,1,1]))},off:{value:0},rep:{value:1},op:{value:1},
    haze:{value:fx.haze},sat:{value:fx.sat},bri:{value:fx.bri},blur:{value:fx.blur},hc:{value:new THREE.Vector3(...fx.hc)}},vertexShader:VS,
  fragmentShader:`uniform sampler2D map;uniform vec3 tint,hc;uniform float off,rep,haze,sat,bri,blur,op;varying vec2 vUv;
  void main(){vec2 uv=vec2(vUv.x*rep+off,vUv.y);vec4 c=texture2D(map,uv);
    if(blur>0.){vec2 d=vec2(blur/rep,blur)*.0012;c=c*.36+(texture2D(map,uv+vec2(d.x,0.))+texture2D(map,uv-vec2(d.x,0.))+texture2D(map,uv+vec2(0.,d.y*3.))+texture2D(map,uv-vec2(0.,d.y*3.)))*.16;}

  }`})}
function carMat(t,r){return new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:false,
  uniforms:{map:{value:t},r:{value:new THREE.Vector4(...r)},glow:{value:1}},vertexShader:VS,
  fragmentShader:`uniform sampler2D map;uniform vec4 r;uniform float glow;varying vec2 vUv;
  void main(){vec4 c=texture2D(map,vUv);vec3 col=c.rgb;float l=dot(col,vec3(.299,.587,.114));
    float inR=step(r.x,vUv.x)*step(vUv.x,r.z)*step(r.y,vUv.y)*step(vUv.y,r.w);
    vec3 night=mix(vec3(l),col,.62)*vec3(.52,.6,.78);            // 달빛 받은 바깥 몸체
    vec3 warm=mix(vec3(l),col,.9)*vec3(1.08,.96,.8)*glow;       // 불 켜진 실내
    col=mix(night,warm,inR);
    gl_FragColor=vec4(col,c.a);
  #include <colorspace_fragment>
  }`})}
function plane(t,w,h,tint,fx){return new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat(t,tint,fx))}

/* ---------- 맨 뒤 그림: 화면에 고정된 무한히 먼 풍경 (하늘·달·먼 불빛·바다) ---------- */
const F=SCENE.far;
function backdrop(cutBelow){
  const m=new THREE.ShaderMaterial({depthWrite:false,depthTest:false,transparent:true,
    uniforms:{map:{value:farT},asp:{value:1},t:{value:0},cut:{value:-1},only:{value:cutBelow?1:0},Him:{value:.6},mAt:{value:.74},hz:{value:.64}},

    void main(){

/* ---------- 가운데 겹 (이음새 없는 반복 그림) ---------- */
const M=SCENE.mid, midT=tex(M.img,true);

/* ---------- 선로 둑 ---------- */
const E=SCENE.emb, embT=tex(E.img,true), embH=E.h*E.scale, embTile=E.w*E.scale, EMBW=embTile*12;

const BGM_OF={busan:'night',gyeongbu:'night',seoul:'night',cloud:'starlit',dawn:'starlit',snow:'snow',baikal:'lake',yenisei:'lake',aurora:'snow',nightvil:'village',steppe:'snow',taiga:'snow',moscow:'russia',plain:'village',berlin:'village',forest:'forest',castle:'forest',alps:'forest',paris:'paris',sea:'lake',england:'london',london:'london'};
const BG={el:[new Audio(),new Audio()],cur:0,key:null,ok:{},vol:.55,force:null};
BG.el.forEach(a=>{a.loop=true;a.preload='none';a.volume=0});
function bgmWant(){if(BG.force)return BG.force;const w=where(dep,vnow());return w.mode==='run'?BGM_OF[w.seg.id]:w.mode==='wait'?'night':'london'}
function bgmFade(a,to,ms,done){const from=a.volume,t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/ms);a.volume=Math.max(0,Math.min(1,from+(to-from)*k));if(k<1)requestAnimationFrame(f);else done&&done()})(t0)}
function bgmTick(){if(!sndOn){BG.el.forEach(a=>{if(!a.paused)bgmFade(a,0,600,()=>a.pause())});BG.key=null;return}
  const k=bgmWant();if(!k||k===BG.key||BG.ok[k]===false)return;BG.key=k;
  const old=BG.el[BG.cur],nx=BG.el[1-BG.cur];nx.src='bgm/'+k+'.mp3';nx.volume=0;
  nx.play().then(()=>{BG.ok[k]=true;BG.cur=1-BG.cur;bgmFade(nx,BG.vol,2200);bgmFade(old,0,2200,()=>old.pause());if(MG)MG.gain.linearRampToValueAtTime(.32,AC.currentTime+2)})
   .catch(()=>{BG.ok[k]=false;BG.key=null})}
setInterval(bgmTick,2000);
const sb=document.getElementById('snd');sb.onclick=e=>{e.stopPropagation();if(!AC)initSound();sndOn=!sndOn;AC.resume();
  MG.gain.cancelScheduledValues(AC.currentTime);MG.gain.linearRampToValueAtTime(sndOn?.55:0,AC.currentTime+.8);if(sndOn)nextClack=Math.max(nextClack,AC.currentTime+.1);
  sb.textContent=sndOn?'♪ 소리 끄기':'♪ 소리 켜기';if(sndAuto)LS.set('bl_mute',sndOn?0:1);setTimeout(bgmTick,50);sb.classList.toggle('on',sndOn)};

function trainNo(d){const k=new Date(d+9*HR);return pd2(k.getUTCMonth()+1)+pd2(k.getUTCDate())}

function trunkArrived(){if(!TRUNK||TRUNK.done)return false;const w=where(TRUNK.dep,vnow());return w.mode==='end'||(w.mode==='run'&&w.h>=TRIP_H-.4)}
function trkShow(){trk.style.display='block';

let mailBoot=true;
function mailTick(){if(!TRIP)return;const met=LS.get('bl_met',{}),ev3=LS.get('bl_ev3',{}),now=vnow();let fresh=[];
  for(const id in MAIL){
    if(met[id]&&!MQ[id+':bye']&&(Q.has('mail')||(typeof CH_OF!=='undefined'&&CH_OF[id]!==undefined&&TRIP.ch>CH_OF[id])))MQ[id+':bye']={at:now+(Q.has('mail')?0:45e3)};
    if(ev3[id]&&MAIL[id].l3&&!MQ[id+':l3'])MQ[id+':l3']={at:Q.has('mail')?now:now+8*6e4}}
  for(const k in MQ){const v=MQ[k];if(!v.got&&v.at<=now){v.got=1;fresh.push(k)}}
  if(fresh.length){mqSave();const id=fresh[0].split(':')[0];
    mailToast(mailBoot&&fresh.length>1?'자리를 비운 사이 편지 '+fresh.length+'통이 도착했어요':(CAST[id]?CAST[id].n:'누군가')+'에게서 편지가 왔어요')}
  else mqSave();
